name: Tests

on:
  push:
    branches: [main]
    paths:
      - "Packages/com.raventween.core/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "Packages/com.raventween.core/**"
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unity ${{ matrix.unityVersion }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        unityVersion:
          - 2021.3.45f1
          - 2022.3.50f1
          - 6000.0.40f1
          - 6000.3.13f1
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Check license secrets
        id: license
        run: |
          if [ -z "$UNITY_LICENSE" ]; then
            echo "::notice::UNITY_LICENSE secret is not set; skipping Unity test run. See CONTRIBUTING.md."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.license.outputs.available == 'true'
        with:
          lfs: true

      - uses: actions/cache@v4
        if: steps.license.outputs.available == 'true'
        with:
          path: Packages/com.raventween.core/Library
          key: Library-${{ matrix.unityVersion }}-${{ hashFiles('Packages/com.raventween.core/**/*.cs') }}
          restore-keys: Library-${{ matrix.unityVersion }}-

      - name: Run package tests
        if: steps.license.outputs.available == 'true'
        uses: game-ci/unity-test-runner@v4
        with:
          packageMode: true
          projectPath: Packages/com.raventween.core
          unityVersion: ${{ matrix.unityVersion }}
          testMode: playmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Test results (${{ matrix.unityVersion }})

      - uses: actions/upload-artifact@v4
        if: always() && steps.license.outputs.available == 'true'
        with:
          name: test-results-${{ matrix.unityVersion }}
          path: artifacts
