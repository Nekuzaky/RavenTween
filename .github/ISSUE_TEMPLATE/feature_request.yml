name: Feature request
description: Propose a new tween type, API, or editor tool.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the use case first, then the API you have in mind.
    validations:
      required: true
  - type: textarea
    id: api
    attributes:
      label: Proposed API
      render: csharp
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround
